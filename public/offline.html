<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex">
  <title>ChronoMap – Offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #09090b; color: #fafafa;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: #a1a1aa; margin: 0 0 24px; max-width: 32ch; }
    a { display: inline-block; padding: 12px 24px; border-radius: 10px; background: #2563eb; color: #fff;
      text-decoration: none; font-weight: 600; min-height: 24px; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="96" height="96" alt="">
    <h1>You're offline</h1>
    <p>ChronoMap needs an internet connection to show live times. Check your connection and try again.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
